<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Feranmi Restaurant">
  <!--
    The brand plate: Feranmi orange, with a blocky "F" cut out of it. Drawn as a
    path rather than set in Bowlby One so the icon needs no webfont, and so it
    stays legible at 16px where fine strokes disappear.
  -->
  <rect width="64" height="64" rx="12" fill="#ee4a1e"/>
  <path d="M20 14 H46 V23 H29 V28 H41 V37 H29 V50 H20 Z" fill="#000000"/>
</svg>
